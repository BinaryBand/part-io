[project]
name = "partio-gui-server"
version = "0.1.0"
description = "Local FastAPI backend bridging the partio GUI (Flutter) to partio's core/adapters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "partio",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[tool.uv.sources]
partio = { path = "../..", editable = true }

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "COM812", # missing-trailing-comma (conflicts with ruff format)
    "ISC001", # single-line-implicit-string-concatenation (conflicts with ruff format)
    "CPY001", # missing-copyright-notice
    "TRY003", "EM101", "EM102", # f-string exception messages are intentional
    # Kept in sync with the root project's TC001-3 policy: static/rules/
    # no-type-checking-guard.yml (repo-root-scoped) forbids `if TYPE_CHECKING:`
    # blocks outright, so these three must stay off to avoid a deadlock with
    # ast-grep. Imports live at module level, visible to every reader/tool.
    "TC001", "TC002", "TC003",
    # FastAPI's own idiom: `Depends(...)`/`Query(...)` as parameter defaults.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "ANN", "D", "INP001", "SLF001"]
"conftest.py" = ["D103", "ANN001", "ARG001", "INP001", "S603", "S607"]
# FastAPI route handlers: boolean query params are the idiom (FBT001/FBT002),
# and a handler with many query params legitimately has many parameters
# (PLR0913), matching how the root project treats partio/cli/** the same way.
"app/api/**" = ["FBT001", "FBT002", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ty]

[build-system]
requires = ["uv_build>=0.9,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[dependency-groups]
dev = [
    "ruff==0.15.*",
    "ty==0.0.59",
    "pytest==9.1.*",
    "httpx>=0.27.0,<1.0.0",
]
